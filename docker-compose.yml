# Sviluppo locale completo: emulatore Firestore + API + sito.
#   docker compose up
# Sito su http://localhost:4321, API su http://localhost:8080,
# interfaccia dell'emulatore su http://localhost:4000.

services:
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: >
      gcloud emulators firestore start
      --host-port=0.0.0.0:8081
      --project=demo-sito-personale
    ports:
      - '8081:8081'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8081']
      interval: 5s
      retries: 20

  api:
    build: .
    environment:
      FIRESTORE_EMULATOR_HOST: firestore:8081
      GOOGLE_CLOUD_PROJECT: demo-sito-personale
      LOG_LEVEL: debug
      # In locale non c'è un proxy davanti: l'IP del client è quello della connessione.
      TRUST_PROXY_HOPS: '0'
    ports:
      - '8080:8080'
    depends_on:
      firestore:
        condition: service_healthy

  web:
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm ci && npm run dev -w web -- --host 0.0.0.0"
    environment:
      API_URL: http://api:8080
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    ports:
      - '4321:4321'
    depends_on:
      - api

volumes:
  web_node_modules:
